<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Планер</title>
  <style>:root { --text: #434343; --border: #e8e0d8; --bg: #faf8f6; --shadow: 0 2px 12px rgba(67, 67, 67, 0.08); --radius: 10px; --font: "Segoe UI", system-ui, -apple-system, sans-serif; } * { box-sizing: border-box; } body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; } .app-header { background: #fff; border-bottom: 1px solid var(--border); padding: 0.65rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; flex-shrink: 0; z-index: 10; } .app-header h1 { margin: 0; font-size: 1.35rem; font-weight: 600; } .tabs { display: flex; gap: 0.5rem; } .tab { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 0.45rem 1rem; border-radius: 999px; cursor: pointer; font-size: 0.9rem; transition: background 0.15s, border-color 0.15s; } .tab:hover { background: #f5f0eb; } .tab.active { background: #434343; color: #fff; border-color: #434343; } main { flex: 1; min-height: 0; padding: 0.5rem 0.65rem 0.65rem; overflow: hidden; display: flex; flex-direction: column; } #weekly { flex: 1; min-height: 0; display: flex; flex-direction: column; } .week-layout { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 0.65rem; } #eisenhower { flex: 1; min-height: 0; overflow: auto; } .panel { flex: 1; min-height: 0; display: flex; flex-direction: column; } .panel[hidden] { display: none !important; } .week-toolbar { display: flex; flex-direction: column; align-items: stretch; gap: 0.45rem; flex-shrink: 0; width: 9.5rem; padding-top: 0.15rem; } .week-label { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; } #weekRange { font-weight: 600; font-size: 0.78rem; line-height: 1.25; text-align: center; } #weekStart { border: 1px solid var(--border); border-radius: 6px; padding: 0.25rem 0.35rem; font-family: inherit; font-size: 0.72rem; width: 100%; } .week-toolbar .btn-icon { align-self: center; } .btn-icon, .btn-secondary { border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer; font-family: inherit; transition: background 0.15s; } .btn-icon { width: 2.25rem; height: 2.25rem; font-size: 1.1rem; } .btn-secondary { padding: 0.38rem 0.55rem; font-size: 0.78rem; width: 100%; } .btn-icon:hover, .btn-secondary:hover { background: #f0ebe5; } .days-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.4rem; overflow: hidden; } .day-card { border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 0; height: 100%; } .day-header { padding: 0.35rem 0.4rem; text-align: center; font-weight: 600; font-size: 0.82rem; line-height: 1.2; } .day-date { font-size: 0.72rem; opacity: 0.85; font-weight: 500; } .progress-block { padding: 0.35rem 0.45rem; background: #fff; border-top: 1px solid rgba(0, 0, 0, 0.06); } .progress-label { font-size: 0.65rem; margin-bottom: 0.2rem; } .progress-bar-wrap { height: 6px; background: rgba(0, 0, 0, 0.12); border-radius: 3px; overflow: hidden; } .progress-bar { height: 100%; border-radius: 4px; transition: width 0.25s ease; } .progress-value { font-size: 0.65rem; margin-top: 0.15rem; text-align: right; } .tasks-section { flex: 1; min-height: 0; padding: 0.3rem 0.35rem 0.15rem; overflow: hidden; } .tasks-title { font-size: 0.68rem; font-weight: 600; margin: 0 0 0.2rem 0.1rem; } .task-row { display: flex; align-items: flex-start; gap: 0.25rem; margin-bottom: 0.12rem; } .task-row input[type="checkbox"] { margin-top: 0.15rem; flex-shrink: 0; width: 0.85rem; height: 0.85rem; accent-color: currentColor; cursor: pointer; } .task-row input[type="text"] { flex: 1; min-width: 0; border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.1); background: transparent; padding: 0.12rem 0.1rem; font-family: inherit; font-size: 0.72rem; line-height: 1.2; color: var(--text); } .task-row input[type="text"]:focus { outline: none; border-bottom-color: rgba(0, 0, 0, 0.35); } .task-row.done input[type="text"] { text-decoration: line-through; opacity: 0.55; } .stats-block { padding: 0.3rem 0.4rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.2rem; font-size: 0.68rem; } .stat-item { display: flex; justify-content: space-between; gap: 0.5rem; } .stat-item strong { font-weight: 600; } .notes-section { padding: 0.3rem 0.35rem 0.35rem; } .notes-title { font-size: 0.68rem; font-weight: 600; margin: 0 0 0.2rem 0.1rem; } .note-row { display: flex; align-items: center; gap: 0.25rem; margin-bottom: 0.12rem; } .note-num { font-size: 0.65rem; opacity: 0.6; width: 0.75rem; text-align: right; } .note-row input { flex: 1; min-width: 0; border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.1); background: transparent; padding: 0.1rem 0.1rem; font-family: inherit; font-size: 0.7rem; line-height: 1.2; } .note-row input:focus { outline: none; border-bottom-color: rgba(0, 0, 0, 0.35); } .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } @media (max-width: 768px) { .matrix-grid { grid-template-columns: 1fr; } } .quadrant { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 0.85rem 1rem 1rem; min-height: 320px; } .quadrant h2 { margin: 0 0 0.75rem; font-size: 1rem; font-weight: 600; padding-bottom: 0.5rem; border-bottom: 2px solid; } .quadrant.q1 h2 { border-color: #ff5252; color: #c62828; } .quadrant.q2 h2 { border-color: #ff9100; color: #e65100; } .quadrant.q3 h2 { border-color: #448aff; color: #0d47a1; } .quadrant.q4 h2 { border-color: #78909c; color: #37474f; } .quadrant.q1 { background: linear-gradient(180deg, #ffcdd2 0%, #fff 45%); } .quadrant.q2 { background: linear-gradient(180deg, #ffe0b2 0%, #fff 45%); } .quadrant.q3 { background: linear-gradient(180deg, #bbdefb 0%, #fff 45%); } .quadrant.q4 { background: linear-gradient(180deg, #cfd8dc 0%, #fff 45%); } .matrix-task { width: 100%; border: none; border-bottom: 1px solid #eee; padding: 0.45rem 0.25rem; margin-bottom: 0.2rem; font-family: inherit; font-size: 0.88rem; background: transparent; } .matrix-task:focus { outline: none; border-bottom-color: #bbb; } .overlay { position: fixed; inset: 0; background: rgba(67, 67, 67, 0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; } .overlay[hidden] { display: none !important; } .overlay-card { width: min(420px, 100%); background: #fff; border-radius: 12px; padding: 1.25rem 1.35rem 1.35rem; box-shadow: var(--shadow); } .overlay-card h2 { margin: 0 0 0.5rem; font-size: 1.15rem; } .overlay-card p { margin: 0 0 0.85rem; font-size: 0.9rem; color: #666; } .overlay-card input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.65rem; font-family: inherit; font-size: 0.9rem; margin-bottom: 0.65rem; } .overlay-card input:focus { outline: none; border-color: #999; } .overlay-error { color: #c62828; font-size: 0.85rem; margin: -0.25rem 0 0.65rem !important; } .remember-row { display: flex; align-items: center; gap: 0.45rem; font-size: 0.85rem; margin: 0 0 0.75rem; cursor: pointer; } .remember-row input { width: auto; margin: 0; } @media (max-width: 600px) { .app-header { padding: 0.85rem 1rem; } main { padding: 1rem; } }</style>
</head>
<body>
  <header class="app-header">
    <h1>Планер</h1>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="weekly" role="tab" aria-selected="true">Недельный планер</button>
      <button type="button" class="tab" data-tab="eisenhower" role="tab" aria-selected="false">Матрица Эйзенхауэра</button>
    </nav>
  </header>

  <main>
    <section id="weekly" class="panel active" role="tabpanel">
      <div class="week-layout">
        <div class="week-toolbar">
          <button type="button" id="todayWeek" class="btn-secondary">Сегодня</button>
          <button type="button" id="saveBtn" class="btn-secondary">Сохранить</button>
          <button type="button" id="prevWeek" class="btn-icon" title="Предыдущая неделя">←</button>
          <div class="week-label">
            <span id="weekRange"></span>
            <input type="date" id="weekStart" aria-label="Начало недели (понедельник)" />
          </div>
          <button type="button" id="nextWeek" class="btn-icon" title="Следующая неделя">→</button>
        </div>
        <div id="daysGrid" class="days-grid"></div>
      </div>
    </section>

    <section id="eisenhower" class="panel" role="tabpanel" hidden>
      <div id="matrixGrid" class="matrix-grid"></div>
    </section>
  </main>

  <div id="licenseOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>Активация Планера</h2>
      <p>Введите лицензионный ключ для запуска приложения.</p>
      <input type="text" id="licenseKey" placeholder="PLAN-XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
      <p id="licenseError" class="overlay-error" hidden></p>
      <button type="button" id="licenseActivate" class="btn-secondary">Активировать</button>
    </div>
  </div>

  <div id="passwordOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="passwordTitle">Пароль шифрования</h2>
      <p id="passwordHint">Данные хранятся в зашифрованном виде на этом компьютере.</p>
      <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off" />
      <input type="password" id="passwordConfirm" placeholder="Повтор пароля" autocomplete="off" hidden />
      <label id="rememberWrap" class="remember-row" hidden>
        <input type="checkbox" id="rememberPassword" />
        Запомнить на этом компьютере
      </label>
      <p id="passwordError" class="overlay-error" hidden></p>
      <button type="button" id="passwordSubmit" class="btn-secondary">Продолжить</button>
    </div>
  </div>

  <script>
const STORAGE_KEY = "planer-data-v2";
const CRYPTO_META_KEY = "planer-crypto-v1";
const REMEMBER_KEY = "planer-remember-v1";
const DEVICE_KEY = "planer-device-key-v1";
const TASKS_PER_DAY = 15;
const NOTES_PER_DAY = 4;
const MATRIX_TASKS = 14;
const DAY_THEMES = [
{ name: "Пн", bg: "#FFD699", accent: "#F7931E", light: "#FFF0CC" },
{ name: "Вт", bg: "#FFB4A8", accent: "#FF5722", light: "#FFDED8" },
{ name: "Ср", bg: "#FFA8B8", accent: "#E91E63", light: "#FFD6E0" },
{ name: "Чт", bg: "#CEA8E0", accent: "#9C27B0", light: "#EAD4F2" },
{ name: "Пт", bg: "#7DD3E3", accent: "#0097A7", light: "#C2EEF5" },
{ name: "Сб", bg: "#8FE8A8", accent: "#43A047", light: "#D4F5DC" },
{ name: "Вс", bg: "#FFE97A", accent: "#FBC02D", light: "#FFF6C2" },
];
const QUADRANTS = [
{ id: "urgentImportant", title: "Срочно и важно", className: "q1" },
{ id: "urgentNotImportant", title: "Срочно, но не важно", className: "q2" },
{ id: "importantNotUrgent", title: "Важно, но не срочно", className: "q3" },
{ id: "notImportantNotUrgent", title: "Не важно и не срочно", className: "q4" },
];
const MONTHS = [
"января", "февраля", "марта", "апреля", "мая", "июня",
"июля", "августа", "сентября", "октября", "ноября", "декабря",
];
let state = defaultState();
let sessionPassword = null;
function defaultDay() {
return {
tasks: Array.from({ length: TASKS_PER_DAY }, () => ({ text: "", done: false })),
notes: Array.from({ length: NOTES_PER_DAY }, () => ""),
};
}
function defaultWeek(weekStart) {
return {
weekStart,
days: Array.from({ length: 7 }, () => defaultDay()),
};
}
function defaultMatrix() {
const matrix = {};
for (const q of QUADRANTS) {
matrix[q.id] = Array.from({ length: MATRIX_TASKS }, () => "");
}
return matrix;
}
function defaultState() {
return {
weekStart: toDateString(mondayOf(new Date())),
weeks: {},
matrix: defaultMatrix(),
};
}
function b64(bytes) {
let binary = "";
bytes.forEach((b) => {
binary += String.fromCharCode(b);
});
return btoa(binary);
}
function b64dec(str) {
const binary = atob(str);
const bytes = new Uint8Array(binary.length);
for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
return bytes;
}
async function deriveKey(password, salt) {
const enc = new TextEncoder();
const baseKey = await crypto.subtle.importKey(
"raw",
enc.encode(password),
"PBKDF2",
false,
["deriveKey"],
);
return crypto.subtle.deriveKey(
{ name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
baseKey,
{ name: "AES-GCM", length: 256 },
false,
["encrypt", "decrypt"],
);
}
async function encryptText(text, password) {
const salt = crypto.getRandomValues(new Uint8Array(16));
const iv = crypto.getRandomValues(new Uint8Array(12));
const key = await deriveKey(password, salt);
const cipher = await crypto.subtle.encrypt(
{ name: "AES-GCM", iv },
key,
new TextEncoder().encode(text),
);
return {
v: 1,
encrypted: true,
salt: b64(salt),
iv: b64(iv),
data: b64(new Uint8Array(cipher)),
};
}
async function decryptText(payload, password) {
const key = await deriveKey(password, b64dec(payload.salt));
const plain = await crypto.subtle.decrypt(
{ name: "AES-GCM", iv: b64dec(payload.iv) },
key,
b64dec(payload.data),
);
return new TextDecoder().decode(plain);
}
function hasCryptoSetup() {
return Boolean(localStorage.getItem(CRYPTO_META_KEY));
}
function parsePlainState(raw) {
const parsed = JSON.parse(raw);
return {
weekStart: parsed.weekStart || defaultState().weekStart,
weeks: parsed.weeks || {},
matrix: { ...defaultMatrix(), ...parsed.matrix },
};
}
async function loadState() {
let raw = localStorage.getItem(STORAGE_KEY);
if (!raw) raw = localStorage.getItem("planer-data-v1");
if (!raw) return defaultState();
try {
const parsed = JSON.parse(raw);
if (parsed?.encrypted) {
if (!sessionPassword) throw new Error("NO_PASSWORD");
const text = await decryptText(parsed, sessionPassword);
return parsePlainState(text);
}
return parsePlainState(raw);
} catch (err) {
if (String(err?.message || err) === "NO_PASSWORD") throw err;
return defaultState();
}
}
async function saveState() {
const plain = JSON.stringify(state);
if (sessionPassword) {
const encrypted = await encryptText(plain, sessionPassword);
localStorage.setItem(STORAGE_KEY, JSON.stringify(encrypted));
localStorage.setItem(CRYPTO_META_KEY, "1");
return;
}
localStorage.setItem(STORAGE_KEY, plain);
}
function mondayOf(date) {
const d = new Date(date);
const day = d.getDay();
const diff = day === 0 ? -6 : 1 - day;
d.setDate(d.getDate() + diff);
d.setHours(0, 0, 0, 0);
return d;
}
function toDateString(date) {
const y = date.getFullYear();
const m = String(date.getMonth() + 1).padStart(2, "0");
const d = String(date.getDate()).padStart(2, "0");
return `${y}-${m}-${d}`;
}
function parseDate(str) {
const [y, m, d] = str.split("-").map(Number);
return new Date(y, m - 1, d);
}
function addDays(dateStr, n) {
const d = parseDate(dateStr);
d.setDate(d.getDate() + n);
return toDateString(d);
}
function formatDateLong(dateStr) {
const d = parseDate(dateStr);
return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function getWeek(weekStart) {
if (!state.weeks[weekStart]) {
state.weeks[weekStart] = defaultWeek(weekStart);
}
return state.weeks[weekStart];
}
function calcDayStats(day) {
const filled = day.tasks.filter((t) => t.text.trim());
const total = filled.length;
const completed = filled.filter((t) => t.done).length;
const progress = total > 0 ? completed / total : 0;
const notDone = Math.max(0, total - completed);
return { total, completed, notDone, progress };
}
function escapeHtml(s) {
return s
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;");
}
const licenseOverlay = document.getElementById("licenseOverlay");
const licenseKeyInput = document.getElementById("licenseKey");
const licenseError = document.getElementById("licenseError");
const licenseActivate = document.getElementById("licenseActivate");
const passwordOverlay = document.getElementById("passwordOverlay");
const passwordTitle = document.getElementById("passwordTitle");
const passwordHint = document.getElementById("passwordHint");
const passwordInput = document.getElementById("passwordInput");
const passwordConfirm = document.getElementById("passwordConfirm");
const passwordError = document.getElementById("passwordError");
const passwordSubmit = document.getElementById("passwordSubmit");
const rememberWrap = document.getElementById("rememberWrap");
const rememberPassword = document.getElementById("rememberPassword");
let matrixReady = false;
function isPreLicensed() {
return location.hash.includes("licensed=1");
}
async function saveRememberedPassword(password) {
const wrapped = await encryptText(password, DEVICE_KEY);
localStorage.setItem(REMEMBER_KEY, JSON.stringify(wrapped));
}
async function tryRememberedPassword() {
const raw = localStorage.getItem(REMEMBER_KEY);
if (!raw) return false;
try {
sessionPassword = await decryptText(JSON.parse(raw), DEVICE_KEY);
await loadState();
return true;
} catch {
sessionPassword = null;
localStorage.removeItem(REMEMBER_KEY);
return false;
}
}
function showOverlay(el) {
el.hidden = false;
}
function hideOverlay(el) {
el.hidden = true;
}
function showLicenseOverlay() {
licenseError.hidden = true;
showOverlay(licenseOverlay);
licenseKeyInput.focus();
}
async function ensureLicense() {
if (isPreLicensed()) return true;
if (!window.pywebview?.api?.check_license) return true;
const res = await window.pywebview.api.check_license();
if (res?.ok) return true;
return new Promise((resolve) => {
showLicenseOverlay();
licenseActivate.onclick = async () => {
licenseError.hidden = true;
const key = licenseKeyInput.value.trim();
const activation = await window.pywebview.api.activate_license(key);
if (activation?.ok) {
hideOverlay(licenseOverlay);
resolve(true);
return;
}
licenseError.textContent = activation?.error || "Не удалось активировать ключ.";
licenseError.hidden = false;
};
});
}
function showPasswordOverlay(mode) {
passwordError.hidden = true;
passwordInput.value = "";
passwordConfirm.value = "";
const isSetup = mode === "setup";
passwordTitle.textContent = isSetup ? "Задайте пароль" : "Введите пароль";
passwordHint.textContent = isSetup
? "Пароль шифрует задачи и заметки на этом компьютере."
: "Для доступа к зашифрованным данным нужен пароль.";
passwordConfirm.hidden = !isSetup;
rememberWrap.hidden = false;
rememberPassword.checked = Boolean(localStorage.getItem(REMEMBER_KEY));
showOverlay(passwordOverlay);
passwordInput.focus();
return new Promise((resolve, reject) => {
passwordSubmit.onclick = async () => {
passwordError.hidden = true;
const pass = passwordInput.value;
if (pass.length < 6) {
passwordError.textContent = "Пароль должен быть не короче 6 символов.";
passwordError.hidden = false;
return;
}
if (isSetup) {
if (pass !== passwordConfirm.value) {
passwordError.textContent = "Пароли не совпадают.";
passwordError.hidden = false;
return;
}
sessionPassword = pass;
if (rememberPassword.checked) {
await saveRememberedPassword(pass);
} else {
localStorage.removeItem(REMEMBER_KEY);
}
hideOverlay(passwordOverlay);
resolve(pass);
return;
}
sessionPassword = pass;
try {
await loadState();
if (rememberPassword.checked) {
await saveRememberedPassword(pass);
} else {
localStorage.removeItem(REMEMBER_KEY);
}
hideOverlay(passwordOverlay);
resolve(pass);
} catch {
sessionPassword = null;
passwordError.textContent = "Неверный пароль.";
passwordError.hidden = false;
}
};
});
}
async function ensurePassword() {
if (hasCryptoSetup() && (await tryRememberedPassword())) {
return;
}
if (!hasCryptoSetup()) {
await showPasswordOverlay("setup");
return;
}
await showPasswordOverlay("unlock");
}
async function bootApp() {
if (!(await ensureLicense())) return;
await ensurePassword();
state = await loadState();
renderWeekly();
}
document.querySelectorAll(".tab").forEach((btn) => {
btn.addEventListener("click", () => {
document.querySelectorAll(".tab").forEach((b) => {
b.classList.remove("active");
b.setAttribute("aria-selected", "false");
});
btn.classList.add("active");
btn.setAttribute("aria-selected", "true");
const tab = btn.dataset.tab;
document.querySelectorAll(".panel").forEach((p) => {
const active = p.id === tab;
p.classList.toggle("active", active);
p.hidden = !active;
});
if (tab === "eisenhower" && !matrixReady) {
renderMatrix();
matrixReady = true;
}
});
});
const weekStartInput = document.getElementById("weekStart");
const weekRangeEl = document.getElementById("weekRange");
const daysGrid = document.getElementById("daysGrid");
const saveBtn = document.getElementById("saveBtn");
function updateWeekLabel() {
const start = state.weekStart;
const end = addDays(start, 6);
weekRangeEl.textContent = `${formatDateLong(start)} — ${formatDateLong(end)}`;
weekStartInput.value = start;
}
function backupPayload() {
return {
version: 2,
exportedAt: new Date().toISOString(),
encrypted: Boolean(sessionPassword),
state,
};
}
function downloadJson(filename, obj) {
const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = filename;
document.body.appendChild(a);
a.click();
a.remove();
URL.revokeObjectURL(url);
}
async function saveBackup() {
const payload = backupPayload();
let output = payload;
if (sessionPassword) {
output = await encryptText(JSON.stringify(payload), sessionPassword);
output.version = 2;
output.exportedAt = payload.exportedAt;
}
const name = sessionPassword
? `planer-backup-${state.weekStart}.planer`
: `planer-backup-${state.weekStart}.json`;
try {
if (window.pywebview?.api?.save_backup) {
const res = await window.pywebview.api.save_backup(JSON.stringify(output));
if (res?.ok) return;
if (res?.cancelled) return;
alert(res?.error || "Не удалось сохранить файл.");
return;
}
} catch (e) {
alert(String(e));
return;
}
downloadJson(name, output);
}
document.getElementById("prevWeek").addEventListener("click", () => {
state.weekStart = addDays(state.weekStart, -7);
void saveState().then(renderWeekly);
});
document.getElementById("nextWeek").addEventListener("click", () => {
state.weekStart = addDays(state.weekStart, 7);
void saveState().then(renderWeekly);
});
document.getElementById("todayWeek").addEventListener("click", () => {
state.weekStart = toDateString(mondayOf(new Date()));
void saveState().then(renderWeekly);
});
if (saveBtn) {
saveBtn.addEventListener("click", () => {
void saveBackup();
});
}
weekStartInput.addEventListener("change", () => {
const picked = parseDate(weekStartInput.value);
state.weekStart = toDateString(mondayOf(picked));
void saveState().then(renderWeekly);
});
function renderWeekly() {
updateWeekLabel();
const week = getWeek(state.weekStart);
daysGrid.innerHTML = "";
for (let i = 0; i < 7; i++) {
const theme = DAY_THEMES[i];
const dayDate = addDays(state.weekStart, i);
const day = week.days[i];
const stats = calcDayStats(day);
const pct = Math.round(stats.progress * 100);
const card = document.createElement("article");
card.className = "day-card";
card.style.setProperty("--day-accent", theme.accent);
card.innerHTML = `
<div class="day-header" style="background:${theme.bg}">
<div>${theme.name}</div>
<div class="day-date">${formatDateLong(dayDate)}</div>
</div>
<div class="progress-block">
<div class="progress-label" style="color:${theme.accent}">Прогресс за день</div>
<div class="progress-bar-wrap">
<div class="progress-bar" style="width:${pct}%;background:${theme.accent}"></div>
</div>
<div class="progress-value" style="color:${theme.accent}">${totalLabel(stats)}</div>
</div>
<div class="tasks-section" style="background:${theme.light}">
<div class="tasks-title">Задачи</div>
<div class="tasks-list" data-day="${i}"></div>
</div>
<div class="stats-block" style="background:${theme.light}">
<div class="stat-item"><span style="color:${theme.accent}">Завершено</span><strong>${stats.completed}</strong></div>
<div class="stat-item"><span style="color:${theme.accent}">Невыполнено</span><strong>${stats.notDone}</strong></div>
</div>
<div class="notes-section" style="background:${theme.bg}88">
<div class="notes-title">Заметки</div>
<div class="notes-list" data-day="${i}"></div>
</div>
`;
const tasksList = card.querySelector(".tasks-list");
day.tasks.forEach((task, ti) => {
const row = document.createElement("div");
row.className = "task-row" + (task.done ? " done" : "");
row.innerHTML = `
<input type="checkbox" ${task.done ? "checked" : ""} data-day="${i}" data-task="${ti}" aria-label="Выполнено" />
<input type="text" value="${escapeHtml(task.text)}" placeholder="" data-day="${i}" data-task="${ti}" data-field="text" />
`;
tasksList.appendChild(row);
});
const notesList = card.querySelector(".notes-list");
day.notes.forEach((note, ni) => {
const row = document.createElement("div");
row.className = "note-row";
row.innerHTML = `
<span class="note-num">${ni + 1}</span>
<input type="text" value="${escapeHtml(note)}" data-day="${i}" data-note="${ni}" />
`;
notesList.appendChild(row);
});
daysGrid.appendChild(card);
}
bindWeeklyEvents();
}
function totalLabel(stats) {
if (stats.total === 0) return "—";
return `${stats.completed} / ${stats.total} (${Math.round(stats.progress * 100)}%)`;
}
function bindWeeklyEvents() {
daysGrid.querySelectorAll('input[type="checkbox"]').forEach((el) => {
el.addEventListener("change", () => {
const dayIdx = Number(el.dataset.day);
const taskIdx = Number(el.dataset.task);
const week = getWeek(state.weekStart);
week.days[dayIdx].tasks[taskIdx].done = el.checked;
el.closest(".task-row").classList.toggle("done", el.checked);
void saveState().then(() => refreshDayStats(dayIdx));
});
});
daysGrid.querySelectorAll('.task-row input[type="text"]').forEach((el) => {
el.addEventListener("input", () => {
const dayIdx = Number(el.dataset.day);
const taskIdx = Number(el.dataset.task);
getWeek(state.weekStart).days[dayIdx].tasks[taskIdx].text = el.value;
void saveState().then(() => refreshDayStats(dayIdx));
});
});
daysGrid.querySelectorAll(".note-row input").forEach((el) => {
el.addEventListener("input", () => {
const dayIdx = Number(el.dataset.day);
const noteIdx = Number(el.dataset.note);
getWeek(state.weekStart).days[dayIdx].notes[noteIdx] = el.value;
void saveState();
});
});
}
function refreshDayStats(dayIdx) {
const cards = daysGrid.children;
if (!cards[dayIdx]) return;
const week = getWeek(state.weekStart);
const stats = calcDayStats(week.days[dayIdx]);
const theme = DAY_THEMES[dayIdx];
const pct = Math.round(stats.progress * 100);
const card = cards[dayIdx];
card.querySelector(".progress-bar").style.width = `${pct}%`;
card.querySelector(".progress-value").textContent = totalLabel(stats);
const statItems = card.querySelectorAll(".stat-item strong");
statItems[0].textContent = stats.completed;
statItems[1].textContent = stats.notDone;
}
const matrixGrid = document.getElementById("matrixGrid");
function renderMatrix() {
matrixGrid.innerHTML = "";
for (const q of QUADRANTS) {
const block = document.createElement("div");
block.className = `quadrant ${q.className}`;
block.innerHTML = `<h2>${q.title}</h2>`;
const tasks = state.matrix[q.id] || [];
for (let i = 0; i < MATRIX_TASKS; i++) {
const input = document.createElement("input");
input.type = "text";
input.className = "matrix-task";
input.value = tasks[i] || "";
input.dataset.quadrant = q.id;
input.dataset.index = String(i);
input.addEventListener("input", () => {
if (!state.matrix[q.id]) state.matrix[q.id] = defaultMatrix()[q.id];
state.matrix[q.id][i] = input.value;
void saveState();
});
block.appendChild(input);
}
matrixGrid.appendChild(block);
}
}
void bootApp();
</script>
</body>
</html>
