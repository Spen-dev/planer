<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Планер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="view-weekly">
  <header class="app-header">
    <h1 class="app-title">Планер</h1>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="weekly" role="tab" aria-selected="true">Недельный</button>
      <button type="button" class="tab" data-tab="eisenhower" role="tab" aria-selected="false">Матрица Эйзенхауэра</button>
    </nav>
    <span class="app-brand" aria-hidden="true">Spen-Dev(C)</span>
  </header>

  <main>
    <section id="weekly" class="panel active" role="tabpanel">
      <div class="week-layout">
        <div class="week-toolbar">
          <button type="button" id="todayWeek" class="btn-secondary">Сегодня</button>
          <button type="button" id="saveBtn" class="btn-secondary">Сохранить</button>
          <button type="button" id="prevWeek" class="btn-icon" title="Предыдущая неделя">←</button>
          <div class="week-label">
            <span id="weekRange"></span>
            <input type="date" id="weekStart" aria-label="Начало недели (понедельник)" />
          </div>
          <button type="button" id="nextWeek" class="btn-icon" title="Следующая неделя">→</button>
        </div>
        <div id="daysGrid" class="days-grid"></div>
      </div>
    </section>

    <section id="eisenhower" class="panel" role="tabpanel" hidden>
      <div id="matrixGrid" class="matrix-grid"></div>
    </section>
  </main>

  <div id="licenseOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>Активация Планера</h2>
      <p>Введите лицензионный ключ для запуска приложения.</p>
      <input type="text" id="licenseKey" placeholder="PLAN-XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
      <p id="licenseError" class="overlay-error" hidden></p>
      <button type="button" id="licenseActivate" class="btn-secondary">Активировать</button>
    </div>
  </div>

  <div id="passwordOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="passwordTitle">Пароль шифрования</h2>
      <p id="passwordHint">Данные хранятся в зашифрованном виде на этом компьютере.</p>
      <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off" />
      <input type="password" id="passwordConfirm" placeholder="Повтор пароля" autocomplete="off" hidden />
      <label id="rememberWrap" class="remember-row" hidden>
        <input type="checkbox" id="rememberPassword" />
        Запомнить на этом компьютере
      </label>
      <p id="passwordError" class="overlay-error" hidden></p>
      <button type="button" id="passwordSubmit" class="btn-secondary">Продолжить</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
